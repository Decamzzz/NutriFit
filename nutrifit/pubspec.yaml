name: nutrifit
description: "NutriFit - seguimiento nutricional inteligente (proyecto universitario)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  # Navigation
  go_router: ^18.0.2

  # Models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Backend / AI / device
  supabase_flutter: ^2.9.0
  google_generative_ai: ^0.4.7
  image_picker: ^1.1.2
  shared_preferences: ^2.5.3

  # Charts
  fl_chart: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  riverpod_generator: ^4.0.9
  riverpod_lint: ^3.1.9
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/recipes/
    - assets/images/
    - lib/recipes_pictures/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.jpg"
  min_sdk_android: 21
